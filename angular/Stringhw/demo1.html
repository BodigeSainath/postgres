 <!-- Print the occurence of each character in a string
   input: 'entertainment'
   output: { e:3 , n:2 , t: 3 ....} -->


   <script>
    let str = 'entertainment';
    let arr= str.split('');
    let res= 1;
    for(word in str){
        if(arr.indexOf(word)=== arr.lastIndexOf(word)){
            res++;
        }
        if(res>1){
            console.log(word +` : ${res}`);
        }
    }
   </script>
